<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>CleanSpark · Job Application</title>
  
  <script>
      (function() {
          const savedTheme = localStorage.getItem('theme') || 'light';
          document.documentElement.setAttribute('data-theme', savedTheme);
      })();
  </script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="css/jobapplication.css">
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>
  
  <div class="app-container">
    <header class="brand-header">
      <div class="logo-area">
        <div class="logo-icon">
          <img src="image/logo.jpeg" alt="CleanSpark Logo" class="logo-image">
        </div>
        <div class="logo-text">
          <span class="brand-name">CleanSpark</span>
          <span class="brand-tagline">Careers</span>
        </div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle dark/light mode">
          <i class="fas fa-moon"></i>
          <i class="fas fa-sun"></i>
        </button>
        <button class="tracking-btn" id="trackingBtn" title="Track Application">
          <i class="fas fa-search"></i>
          <span class="tracking-btn-text">Track Application</span>
        </button>
        <a href="index.html" class="home-icon-btn" title="Go to Homepage">
          <i class="fas fa-home"></i>
        </a>
        <span class="status-badge" id="globalStatusBadge">
          <i class="fas fa-circle"></i> <span id="globalStatusText">Checking...</span>
        </span>
      </div>
    </header>

    <main class="main-content">
      <div id="dynamicPanel" class="panel-container"></div>
    </main>

    <footer class="app-footer">
      <p>© <span id="currentYear"></span> CleanSpark Inc. All rights reserved. Equal opportunity employer.</p>
    </footer>
  </div>

  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <script src="js/theme.js"></script>
  <script src="js/api.js"></script>
  <script src="js/jobapplication.js"></script>
</body>
</html>
